name: Dyvix Quality Check

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api repos/${{ github.repository }}/compare/$BASE_SHA...$HEAD_SHA \
            --jq '
              .files[]
              | select(.status | IN("added","modified","renamed","copied","changed"))
              | .filename
            ' |
          grep -Ev '^\.github/' |
          grep -E '\.(js|cjs|mjs|ts|tsx|jsx|json|jsonc|css|scss|less|html|md|mdx|yaml|yml)$' \
          > files.txt || true

          if [ -s files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout PR
        if: steps.files.outputs.has_files == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr_head
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Copy changed files
        if: steps.files.outputs.has_files == 'true'
        run: |
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"

            if [ -f "pr_head/$file" ]; then
              cp "pr_head/$file" "$file"
            else
              rm -f "$file"
            fi
          done < files.txt
          rm -rf pr_head

      - name: Snapshot PR files
        if: steps.files.outputs.has_files == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR snapshot" --no-verify || true

      - uses: actions/setup-node@v4
        if: steps.files.outputs.has_files == 'true'
        with:
          node-version: 24

      - name: Format
        if: steps.files.outputs.has_files == 'true'
        run: |
          xargs -r npx prettier@3.8.1 --config .prettierrc.json --write < files.txt

      - name: Check for formatting changes
        id: diff
        if: steps.files.outputs.has_files == 'true'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: parkerbxyz/suggest-changes@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment: Prettier found some formatting issues! Click below to apply the fixes directly.
          event: REQUEST_CHANGES

      - name: Status
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "Formatting changes are required."
          exit 1
